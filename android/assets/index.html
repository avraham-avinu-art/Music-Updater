<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Pulse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top" id="top">
    <div class="bar">
      <div class="brand">
        <h1 class="logo"><img src="logo.png" alt="">Pulse</h1>
        <p class="conn" id="conn"><span class="dot"></span><span id="connText">מנותק</span></p>
      </div>
      <button class="icon-btn" id="searchToggle" type="button" aria-label="חיפוש">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="הגדרות">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
    <label class="search hidden" id="searchBox">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="חיפוש שיר, זמר או אלבום" autocomplete="off">
    </label>
    <nav class="tabs" id="tabs">
      <button type="button" data-source="all" class="on">הכל</button>
      <button type="button" data-source="nigun">שיר חדש</button>
      <button type="button" data-source="news">חדשות המוזיקה</button>
      <button type="button" data-source="bot">שיר בוט</button>
    </nav>
  </header>

  <div class="banner" id="banner"><span class="bspin" id="bannerSpin"></span><span id="bannerText"></span></div>

  <section class="state" id="state">
    <div class="spinner"></div>
    <h2 id="stateTitle">מחפש חיבור</h2>
    <p id="stateText">חבר את הנגן למחשב בכבל</p>
  </section>

  <div id="content">
    <p class="results hidden" id="results"></p>
    <div id="feed"></div>
    <div class="more" id="more"><div class="spinner"></div></div>
  </div>

  <div class="scrim" id="scrim"></div>

  <section class="sheet" id="sheet" role="dialog" aria-modal="true">
    <button class="close" id="sheetClose" type="button" aria-label="סגירה">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div class="hero-art" id="sheetArt"></div>
    <h2 id="sheetName"></h2>
    <p class="by" id="sheetArtist"></p>
    <button class="action" id="sheetDl" type="button"><span class="fill" id="sheetFill"></span><span class="label" id="sheetLabel"></span></button>
    <dl class="facts" id="sheetFacts"></dl>
    <p class="about" id="sheetAbout"></p>
  </section>

  <section class="sheet settings" id="settings" role="dialog" aria-modal="true">
    <div class="grip"></div>
    <h2>הגדרות</h2>
    <button class="setting" id="autoRow" type="button">
      <span class="setting-text">
        <span class="setting-title">הורדה אוטומטית</span>
        <span class="setting-sub" id="autoSub"></span>
      </span>
      <span class="switch"><span class="knob"></span></span>
    </button>
    <p class="group">שמירה אל</p>
    <div id="storages"></div>
    <p class="group">חיבור</p>
    <div class="setting static"><span class="setting-text"><span class="setting-title" id="setConn"></span><span class="setting-sub" id="setCount"></span></span></div>
  </section>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
